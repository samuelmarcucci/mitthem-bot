name: Bevaka Mitthem

on:
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bevaka
  cancel-in-progress: false

jobs:
  kolla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kolla efter nya lagenheter
        run: python3 bot.py
        env:
          NTFY_KANAL: ${{ secrets.NTFY_KANAL }}
      - name: Spara seen.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "Uppdatera seen.json" && git push)
